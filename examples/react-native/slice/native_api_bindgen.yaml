# native-api-bindgen configuration for the React Native slice (Android + iOS).
platform:
  android:
    sdk: auto
    platform: "36"
    minApi: 24
    entries:
      - android.content.Intent
      - android.net.Uri
      - android.os.Bundle
      - android.content.Context
      - android.app.Activity
      - android.os.Handler
      - android.os.Looper
      - java.lang.Runnable
      - android.os.Handler.Callback
      - android.os.Message
      - java.util.Arrays
      - android.view.View
      - android.widget.TextView
      - com.example.kfixtures.Greeter   # Kotlin library class (suspend functions)
    depth: 0
    libraries:
      - ../../../fixtures/kotlin/basic/build/libs/kfixtures.jar

  ios:
    sdk: auto
    minVersion: "15.1"   # React Native 0.87 minimum; newer APIs get runtime guards
    frameworks: [Foundation, UIKit]
    classes:
      - UIDevice
      - UIView
      - UIViewController
      - UIColor
      - NSProcessInfo
      - NSFileManager
      - NSArray
      - NSOperationQueue
      - NSFileManagerDelegate
      - NSCache
      - NSCacheDelegate
      - NSURL
      - UILabel
    depth: 0

targets:
  flutter: false
  reactNative: true

generation:
  typescriptMode: strict-typescript
  annotations: preserve
  callbacks: true

output:
  reactNativeDir: native-api-bindings

distribution:
  generatedArtifacts: local-only
  documentationMode: links-only
