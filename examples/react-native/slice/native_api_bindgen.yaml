# native-api-bindgen configuration for the React Native slice (Android + iOS).
platform:
  android:
    sdk: auto
    platform: "36"
    minApi: 24
    entries:
      - android.content.Intent
      - android.net.Uri
      - android.os.Bundle
      - android.content.Context
      - android.app.Activity
      - android.os.Handler
      - android.os.Looper
      - java.lang.Runnable
      - android.os.Handler.Callback
      - android.os.Message
      - java.util.Arrays
      - android.os.Debug
      - android.view.View
      - android.widget.TextView
      - com.example.kfixtures.Greeter   # Kotlin library class (suspend functions)
      # Showcase tasks (src/showcase/android.ts)
      - android.content.IntentFilter
      - android.os.BatteryManager
      - android.app.ActivityManager
      - android.app.ActivityManager.MemoryInfo
      - android.os.StatFs
      - android.os.Environment
      - java.io.File
      - android.net.ConnectivityManager
      - android.net.Network
      - android.net.NetworkCapabilities
      - android.content.ClipboardManager
      - android.content.ClipData
      - android.content.ClipData.Item
      - android.content.SharedPreferences
      - android.content.SharedPreferences.Editor
      - android.os.Vibrator
      - android.os.VibrationEffect
      - android.speech.tts.TextToSpeech
      - android.speech.tts.TextToSpeech.OnInitListener
      - android.widget.Toast
      - android.os.Build
      - java.util.Locale
      - android.provider.Settings
    depth: 0
    libraries:
      - ../../../fixtures/kotlin/basic/build/libs/kfixtures.jar

  ios:
    sdk: auto
    minVersion: "15.1"   # React Native 0.87 minimum; newer APIs get runtime guards
    frameworks: [Foundation, UIKit, AVFAudio]
    classes:
      - UIDevice
      - UIView
      - UIViewController
      - UIColor
      - NSProcessInfo
      - NSFileManager
      - NSArray
      - NSOperationQueue
      - NSFileManagerDelegate
      - NSCache
      - NSCacheDelegate
      - NSURL
      - UILabel
      # Showcase tasks (src/showcase/ios.ts)
      - UIApplication
      - UIScene
      - UIWindowScene
      - UIWindow
      - UIActivityViewController
      - UIPopoverPresentationController
      - UIPasteboard
      - UIFeedbackGenerator
      - UIImpactFeedbackGenerator
      - UINotificationFeedbackGenerator
      - NSUserDefaults
      - NSNumber
      - NSValue
      - NSSet
      - NSDictionary
      - AVSpeechSynthesizer
      - AVSpeechUtterance
      - AVSpeechSynthesisVoice
    depth: 0

targets:
  flutter: false
  reactNative: true

generation:
  typescriptMode: strict-typescript
  annotations: preserve
  callbacks: true

output:
  reactNativeDir: native-api-bindings

distribution:
  generatedArtifacts: local-only
  documentationMode: links-only
