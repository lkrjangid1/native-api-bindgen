# native-api-bindgen configuration for the iOS vertical slice.
platform:
  ios:
    sdk: auto            # iphonesimulator via xcrun
    minVersion: "15.0"   # = the app deployment target; newer APIs get runtime guards
    frameworks: [Foundation, UIKit]
    classes:
      - UIDevice
      - UIView
      - UIViewController
      - UIColor
      - NSProcessInfo
      - NSFileManager
      - NSOperationQueue
      - UILabel
    depth: 0
    swift:                 # Swift-only APIs get generated @objc adapters (Layer 2)
      adaptersDir: ios/NativeApiSwiftAdapters
      modules:
        - name: NABSwiftFixtures
          sources: [../../../fixtures/swift/basic/NABSwiftFixtures.swift]

targets:
  flutter: true
  reactNative: false

output:
  dir: lib/src/generated

distribution:
  generatedArtifacts: local-only
  documentationMode: links-only
