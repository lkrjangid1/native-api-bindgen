# native-api-bindgen configuration for the Android vertical slice.
platform:
  android:
    sdk: auto
    platform: "36"      # pinned so the example is reproducible
    minApi: 24          # newer APIs get runtime guards
    entries:
      - android.content.Intent
      - android.net.Uri
      - android.os.Bundle
      - android.content.Context
      - android.app.Activity
      - android.os.Handler
      - android.os.Looper
      - java.lang.Runnable
      - android.os.Handler.Callback
      - android.os.Message
      - java.util.Arrays
      - android.view.View
      - android.widget.TextView
      - com.example.kfixtures.Greeter   # Kotlin library class (suspend functions)
      # Showcase tasks (lib/src/showcase.dart)
      - android.content.IntentFilter
      - android.os.BatteryManager
      - android.app.ActivityManager
      - android.app.ActivityManager.MemoryInfo
      - android.os.StatFs
      - android.os.Environment
      - java.io.File
      - android.net.ConnectivityManager
      - android.net.Network
      - android.net.NetworkCapabilities
      - android.content.ClipboardManager
      - android.content.ClipData
      - android.content.ClipData.Item
      - android.content.SharedPreferences
      - android.content.SharedPreferences.Editor
      - android.os.Vibrator
      - android.os.VibrationEffect
      - android.speech.tts.TextToSpeech
      - android.speech.tts.TextToSpeech.OnInitListener
      - android.widget.Toast
      - android.os.Build
      - java.util.Locale
      - android.provider.Settings
    depth: 0
    libraries:
      - ../../../fixtures/kotlin/basic/build/libs/kfixtures.jar

targets:
  flutter: true
  reactNative: false

generation:
  mode: strict-native
  annotations: preserve
  callbacks: true

output:
  dir: lib/src/generated

distribution:
  generatedArtifacts: local-only
  documentationMode: links-only
