name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # package:jni (used by native_api_runtime) requires the Flutter SDK, so
      # use Flutter's bundled Dart rather than a standalone Dart SDK.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: dart pub get
      - name: Resolve the Flutter-only runtime package (not in the workspace)
        working-directory: runtimes/flutter/native_api_ui
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed packages runtimes tools
      - name: Analyze
        run: dart analyze --fatal-infos packages runtimes
      - name: Unit, fixture, golden, fuzz and CLI tests
        run: dart test packages
      - name: License / source audit (fails on BLOCK)
        run: dart run native_api_bindgen audit-license
      - name: Package validation (IR package has no internal deps)
        working-directory: packages/native_api_ir
        run: dart pub publish --dry-run || echo "::warning::pub publish dry-run reported issues (publishing not enabled yet)"
