name: react-native

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  generator:
    name: RN goldens, tsc, clang, Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # package:jni (used by native_api_runtime) requires the Flutter SDK, so
      # use Flutter's bundled Dart rather than a standalone Dart SDK.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - run: dart pub get
      - name: Build the Kotlin fixture library
        run: fixtures/kotlin/basic/gradlew -p fixtures/kotlin/basic jar
      - name: Generate the example's bindings
        run: dart run native_api_bindgen --project examples/react-native/slice generate react-native
      - working-directory: examples/react-native/slice
        run: npm ci
      - name: RN goldens + tsc + clang++ syntax check
        run: dart test packages/native_api_react_native_android
      - name: Jest (TypeScript runtime)
        working-directory: examples/react-native/slice
        run: npx jest

  ios:
    name: RN iOS goldens + example self-tests on a simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the obsolete "tools" package, which
          # sdkmanager no longer finds.
          packages: platform-tools
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # package:jni (used by native_api_runtime) requires the Flutter SDK, so
      # use Flutter's bundled Dart rather than a standalone Dart SDK.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - run: dart pub get
      - name: Build the Kotlin fixture library
        run: fixtures/kotlin/basic/gradlew -p fixtures/kotlin/basic jar
      - name: Generate the example's bindings
        run: dart run native_api_bindgen --project examples/react-native/slice generate react-native
      - working-directory: examples/react-native/slice
        run: npm ci
      - name: RN iOS goldens + tsc + Objective-C++ syntax check
        run: dart test packages/native_api_react_native_ios
      - name: Build for the simulator and run self-tests
        run: tools/run_rn_ios_tests.sh

  ios-bindings:
    # The example app imports its iOS bindings too, and those can only be
    # generated on macOS. Generate them here for the Linux emulator job.
    name: Generate the example's iOS bindings
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: dart pub get
      - run: dart run native_api_bindgen --project examples/react-native/slice generate react-native-ios
      - uses: actions/upload-artifact@v4
        with:
          name: rn-ios-bindings
          path: examples/react-native/slice/native-api-bindings
          include-hidden-files: true

  device:
    name: RN example self-tests on an Android emulator
    needs: ios-bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # package:jni (used by native_api_runtime) requires the Flutter SDK, so
      # use Flutter's bundled Dart rather than a standalone Dart SDK.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - run: dart pub get
      - name: Build the Kotlin fixture library
        run: fixtures/kotlin/basic/gradlew -p fixtures/kotlin/basic jar
      - uses: actions/download-artifact@v5
        with:
          name: rn-ios-bindings
          path: examples/react-native/slice/native-api-bindings
      - working-directory: examples/react-native/slice
        run: npm ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build x86_64 and run self-tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            sed -i 's/reactNativeArchitectures=arm64-v8a/reactNativeArchitectures=x86_64/' examples/react-native/slice/android/gradle.properties
            tools/run_rn_device_tests.sh
