name: ios

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generator:
    name: Objective-C extraction, goldens, Foundation+UIKit compile check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run native_api_bindgen doctor || true
      - run: dart test packages/native_api_ios packages/native_api_flutter_ios
      - name: Generate all of Foundation + UIKit and analyze
        run: |
          out="$RUNNER_TEMP/objcgen"
          mkdir -p "$out"
          printf 'name: objcgen\npublish_to: none\nenvironment:\n  sdk: ^3.9.0\ndependencies:\n  ffi: ^2.1.3\n  objective_c: ^9.5.0\n' > "$out/pubspec.yaml"
          dart run packages/native_api_flutter_ios/tool/gen_sdk.dart "$out/lib/sdk"
          (cd "$out" && dart pub get && dart analyze lib/sdk)

  example:
    name: Flutter iOS example on a simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart pub get
      - name: Generate bindings for the example
        run: dart run native_api_bindgen --project examples/flutter/ios_slice generate ios
      - name: Boot a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - working-directory: examples/flutter/ios_slice
        run: |
          flutter pub get
          flutter analyze
          flutter test integration_test -d "${{ steps.sim.outputs.udid }}"
