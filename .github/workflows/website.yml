name: website

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/benchmarks/**
      - tools/build_website.dart
      - tools/website/**
      - tools/check_seo.dart
      - .github/workflows/website.yml
  pull_request:
    paths:
      - website/**
      - docs/benchmarks/**
      - tools/build_website.dart
      - tools/website/**
      - tools/check_seo.dart
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the static site
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: sitemap.xml lastmod and dateModified come from git.
          fetch-depth: 0
      # package:jni (used by native_api_runtime) requires the Flutter SDK, so
      # use Flutter's bundled Dart rather than a standalone Dart SDK.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: dart pub get
      - id: pages
        if: github.event_name != 'pull_request'
        # Fails until Settings → Pages → Source is set to "GitHub Actions";
        # the site is still built and checked, just not deployed.
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Build (fails on broken internal links, duplicate titles, size budgets)
        run: dart run tools/build_website.dart
        env:
          NAB_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NAB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - name: SEO checks on every page
        run: dart run tools/check_seo.dart website/build
        env:
          NAB_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: External links
        run: dart run tools/check_links.dart website/build
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    if: needs.build.outputs.pages == 'success' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
