name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: "41 3 * * 2"

permissions:
  contents: read

jobs:
  fuzz-and-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Parser fuzz tests
        run: dart test packages/native_api_android/test/fuzz_test.dart packages/native_api_ir/test/fuzz_test.dart
      - name: Path-guard tests
        run: dart test packages/native_api_core/test/path_guard_test.dart
      - name: Known-vulnerability scan of dependencies (OSV)
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.0.3/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=pubspec.lock
