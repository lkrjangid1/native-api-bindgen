name: release-check

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  generator:
    uses: ./.github/workflows/generator.yml
  android:
    uses: ./.github/workflows/android.yml
  flutter:
    uses: ./.github/workflows/flutter.yml
  license:
    uses: ./.github/workflows/license-audit.yml
  security:
    uses: ./.github/workflows/security.yml
  ios:
    uses: ./.github/workflows/ios.yml
  react-native:
    uses: ./.github/workflows/react-native.yml
  website:
    uses: ./.github/workflows/website.yml
  size:
    name: Release APK size (one API vs. whole SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - run: dart pub get
      - run: python3 tools/measure_size.py
  publish-dry-run:
    name: Package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # package:jni (used by native_api_runtime) requires the Flutter SDK, so
      # use Flutter's bundled Dart rather than a standalone Dart SDK.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: dart pub get
      - run: tools/check_publish.sh
