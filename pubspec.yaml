name: native_api_bindgen_workspace
description: Monorepo workspace for native-api-bindgen. Not published.
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - packages/native_api_ir
  - packages/native_api_core
  - packages/native_api_android
  - packages/native_api_generator
  - packages/native_api_flutter_android
  - packages/native_api_react_native_android
  - packages/native_api_ios
  - packages/native_api_flutter_ios
  - packages/native_api_react_native_ios
  - packages/native_api_cli
  - runtimes/dart/native_api_runtime

dev_dependencies:
  lints: ^6.0.0
  markdown: ^7.3.1
